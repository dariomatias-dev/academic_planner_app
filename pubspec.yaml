name: academic_planner
description: "A productivity app designed to help students manage tasks, deadlines, and study plans efficiently."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  cloud_firestore: ^6.3.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.0
  flutter_riverpod: ^3.3.1
  fluttertoast: ^9.0.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  google_sign_in: ^6.3.0
  image_gallery_saver_plus: ^4.0.1
  intl: ^0.20.2
  logger: ^2.7.0
  logging: ^1.2.0
  package_info_plus: ^9.0.1
  riverpod: ^3.2.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  syncfusion_flutter_calendar: ^33.1.46
  syncfusion_flutter_pdfviewer: ^33.1.44
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  fake_cloud_firestore: 4.1.0+1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.3.7+1
  url_launcher_platform_interface: ^2.3.2
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
