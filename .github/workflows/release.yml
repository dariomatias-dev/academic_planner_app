name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "academic_planner-${{ github.event.release.tag_name }}.apk"

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: academic_planner-${{ github.event.release.tag_name }}.apk
